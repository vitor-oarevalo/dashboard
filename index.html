<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Temperatura e Umidade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="dashboard">

    <header class="dashboard-header">
        <div>
            <span class="subtitle">MONITORAMENTO AMBIENTAL</span>
            <h1>Temperatura e Umidade</h1>
            <p>Acompanhe os dados de temperatura e umidade ao longo do tempo.</p>
        </div>
    </header>


    <section class="charts">

        <div class="chart-card">
            <div class="chart-header">
                <div>
                    <span class="chart-label">DADOS DO DIA</span>
                    <h2>Temperatura e Umidade</h2>
                    <p>Variação dos dados entre 12:00 e 17:00.</p>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="lineChart"></canvas>
            </div>
        </div>


        <div class="chart-card">
            <div class="chart-header">
                <div>
                    <span class="chart-label">MÉDIA MENSAL</span>
                    <h2>Temperatura e Umidade por Mês</h2>
                    <p>Comparação das médias registradas durante o semestre.</p>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </div>

    </section>


</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="script.js"></script>

</body>
</html>
